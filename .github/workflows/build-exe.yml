# Builds HallowsEveDetector.exe on every push to main and publishes it as the latest
# release. The README's download link and the app's "Check for updates" both use it.
name: Build the exe

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Pick the version
        id: version
        shell: pwsh
        run: |
          $tag = "v" + (Get-Date -Format "yy.M.d") + "." + $env:GITHUB_RUN_NUMBER
          "tag=$tag" >> $env:GITHUB_OUTPUT
          git log -1 --format=%B | Out-File -Encoding utf8 release_notes.txt

      - name: Build and self-test
        shell: pwsh
        run: ./build_exe.ps1 -Version "${{ steps.version.outputs.tag }}"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.txt
          files: dist/HallowsEveDetector.exe
          make_latest: "true"
